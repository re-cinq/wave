<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Not Found &mdash; Wave</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
  {{template "partials/nav" .}}

  <div class="w-container">
    <div class="w-empty" style="padding: 80px 20px;">
      <h2 style="font-size: 64px; font-weight: 700; color: var(--color-text-muted); margin-bottom: 8px;">404</h2>
      <h3 style="margin-bottom: 4px;">Page not found</h3>
      <p style="color: var(--color-text-secondary); font-size: 13px; margin-bottom: 24px;">The page you requested does not exist or has been moved.</p>
      <div style="display: flex; gap: 8px;">
        <button class="w-btn" onclick="window.history.back()">Go Back</button>
        <a href="/runs" class="w-btn w-btn-primary" style="text-decoration: none;">Go to Runs</a>
        <a href="/pipelines" class="w-btn" style="text-decoration: none;">View Pipelines</a>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
